# The Lewis referential game: two organisms invent a discrete protocol.
#
# Sender sees one of 8 referents and emits one of 8 symbols through a
# parameter-free consensus readout over its living cells. Receiver sees NOTHING
# but that symbol and must name the referent. Nobody tells them what the symbols
# mean.
#
# Both warm-start from the morphology checkpoint so neither relearns how to be a
# body. Parameters stay separate -- no weight sharing, no shared state.

_base_: base.yaml

name: comm
# Warm-start from the BROADCAST model, not the morphology one. M3a proved
# per-cell supervision is what carries a referent to the periphery (95%
# agreement); starting from the morphology model instead left the sender
# unable to propagate, and its symbol logits varied by only 0.012 across
# referents -- the vote channels never learned the referent was there.
init_from: runs/broadcast/ckpt/last.pt
prefill_grow: 64

target:
  radius: 7.0

task:
  n_referents: 8
  vocab: 8           # N <= V^L holds exactly: 8 <= 8^1, so 3 bits for 3 bits
  msg_len: 1
  t_inject: 16
  patch: 3
  tau_start: 2.0     # explore early
  tau_end: 0.5       # near-discrete late
  tau_anneal_steps: 3000

train:
  phase: comm
  pool_size: 512          # two organisms => two pools; 1024 each is 234 MB
  steps: 6000
  lr: 1.0e-3
  lr_milestones: [4000]

  pool_from_step: 0
  damage_from_step: null   # damage arrives in M4; isolate emergence first

  rollout_min: 64
  rollout_max: 96

  # MEASURED, and the previous value was catastrophically wrong. In the comm phase
  # the task gradient reaching the sender is ~1e-4 -- it crosses a discrete channel,
  # a second organism, and ~64 steps of BPTT. At lambda_morph=30 morphology
  # outweighed the task 255,000:1 and accuracy sat at chance for 1050 steps.
  # Parity is ~1.2e-4; 3e-5 lets the task dominate ~4:1 while still holding the
  # body, which is already solved (IoU 1.000) and so contributes little gradient.
  lambda_morph: 3.0e-5
  # Dropout on the SENDER's readout is noise on the single transmitted symbol,
  # which fights convention formation. It was harmless in M3a because supervision
  # was per-cell; here it corrupts the channel itself.
  readout_dropout: 0.05

  log_interval: 50
  ckpt_interval: 1000
  early_stop_on_gates: false
