# The Lewis referential game: two organisms invent a discrete protocol.
#
# Sender sees one of 8 referents and emits one of 8 symbols through a
# parameter-free consensus readout over its living cells. Receiver sees NOTHING
# but that symbol and must name the referent. Nobody tells them what the symbols
# mean.
#
# Both warm-start from the BROADCAST checkpoint (see init_from below) so neither
# relearns how to be a body. Parameters stay separate -- no weight sharing, no
# shared state.

_base_: base.yaml

name: comm
# Warm-start from the BROADCAST model, not the morphology one. M3a proved
# per-cell supervision is what carries a referent to the periphery (95%
# agreement); starting from the morphology model instead left the sender
# unable to propagate, and its symbol logits varied by only 0.012 across
# referents -- the vote channels never learned the referent was there.
init_from: runs/broadcast/ckpt/last.pt
prefill_grow: 64

target:
  radius: 7.0

task:
  n_referents: 8
  vocab: 8           # N <= V^L holds exactly: 8 <= 8^1, so 3 bits for 3 bits
  msg_len: 1
  t_inject: 16
  patch: 3
  tau_start: 2.0     # explore early
  tau_end: 0.5       # near-discrete late
  tau_anneal_steps: 3000

train:
  phase: comm
  pool_size: 512          # two organisms => two pools; 1024 each is 234 MB
  steps: 6000
  lr: 1.0e-3
  lr_milestones: [4000]

  pool_from_step: 0
  damage_from_step: null   # damage arrives in M4; isolate emergence first

  rollout_min: 64
  rollout_max: 96

  # MEASURED on THIS configuration -- the values do not transfer across
  # warm-starts or loss compositions, which is the whole lesson here. Fresh
  # measurement on the broadcast warm-start, fc2 grad norms, batch 32, T=64:
  #
  #   task 0.369   vote_s 4.348   morph_s 0.471    (sender)
  #   task 4.957   vote_r 4.256   morph_r 0.496    (receiver)
  #
  # lambda_vote is the fix for the run that stalled at chance for 2750 steps
  # (runs/comm_pooled_only_stall): without per-cell supervision the
  # broadcast-installed code dissolved -- agreement 0.95 -> 0.40 inside 250
  # steps -- and since the Gumbel-max channel transmits a SAMPLE of the pooled
  # vote at every tau, the receiver heard near-uniform noise and nothing could
  # relearn. 0.25 puts sender code maintenance at ~2.9x the task pull and adds
  # ~0.2x of dense per-cell decode pressure on the receiver (M3a's lesson,
  # applied to both organisms). NOTE for the from-scratch arm: drop the sender
  # vote term or retarget it at the emitted symbol, and expect to re-measure.
  lambda_vote: 0.25
  # The old 12.0 was calibrated as "2x task" on a different instrument; on this
  # one it put morphology at 15x the task, and per-tensor grad normalization
  # then starved the vote/task rows of fc2 (iou pinned 1.000 while the code
  # dissolved). 4.0 keeps the body at ~2x the vote anchor. The old brackets
  # still stand: ~0 dissolves the body, 30 buries the task.
  # Seed variance is high, so do not over-tune either value.
  lambda_morph: 4.0
  readout_dropout: 0.05

  log_interval: 50
  ckpt_interval: 250      # a kill costs at most 250 steps; see train_resilient.sh
  early_stop_on_gates: false
