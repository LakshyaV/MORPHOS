# Defaults every experiment inherits. Child configs use `_base_: base.yaml`.
# Override on the CLI with `--set train.lr=3e-4` (RHS parsed as YAML).

name: base
seed: 0

# Measured, not assumed: MPS beats native arm64 CPU 11.2x on the decisive
# 2-organism step. See `make bench` and the README table.
device: mps

target:
  shape: disk          # disk | disk_gradient | tadpole
  radius: 10.0         # 341 alive cells on a 32 grid; max Chebyshev geodesic = 10
  edge: 1.0
  color: [0.20, 0.60, 0.86]

nca:
  hidden: 128
  grid: 32
  fire_rate: 0.5
  alive_threshold: 0.1

train:
  phase: morph
  steps: 6000
  batch: 32
  lr: 2.0e-3
  lr_milestones: [2000]     # upstream: PiecewiseConstantDecay([2000], [2e-3, 2e-4])
  lr_gamma: 0.1
  grad_norm_per_tensor: true

  # ONE scalar per training step, not per sample -- matching upstream.
  rollout_min: 64
  rollout_max: 96

  # Mandatory on 8 GB. 3300 MB -> 1110 MB at T=64, and then nearly flat in T.
  checkpoint_every: 8

  pool_size: 1024
  pool_from_step: 1000      # Growing regime first, then Persistent/Regenerating
  damage_from_step: 1000

  # Fractions, not counts: reseed/batch is the loss weight on growth-from-seed,
  # and batch/reseed is the mean pool-entry age. Upstream 1-of-8 and 3-of-8.
  reseed_worst: 4
  damage_best: 12

  log_interval: 50
  gate_interval: 500
  ckpt_interval: 1000
  early_stop_on_gates: true

guard:
  death_threshold: 0.1
  death_patience: 3
  max_resets: 3

eval:
  t_grow: 64
  t_persist: 256
  g1_rollouts: 128
  g2_trials: 256
  g2_severity: 0.30
  g2_tolerance: 0.02
  g2_recover_steps: 128
